name: Build CopyManga Xposed APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 如果仓库中尚未上传工程文件，就地自动生成完整源码与 Gradle 结构
      - name: Ensure Android Project Files
        env:
          ARCHIVE_B64: ""
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            echo ">>> 仓库未检测到工程：自动解包拷贝漫画 Xposed 模块全套源码..."
            echo "$ARCHIVE_B64" | base64 -d | tar -xz
          fi

      # 接受 Android SDK 协议许可
      - name: Accept Android SDK Licenses
        run: |
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      # 安装官方 Gradle 8.6 并替换 GitHub Runner 预装的 Gradle 9
      - name: Set up Gradle 8.6
        run: |
          echo ">>> 下载并配置官方 Gradle 8.6 (确保兼容 AGP 8.4)..."
          curl -sSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo rm -f /usr/bin/gradle /usr/local/bin/gradle
          sudo ln -s /opt/gradle-8.6/bin/gradle /usr/local/bin/gradle
          sudo ln -s /opt/gradle-8.6/bin/gradle /usr/bin/gradle
          gradle -v
          gradle wrapper --gradle-version 8.6

      # 执行编译打包（产出 Release 与 Debug APK）
      - name: Build Release & Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      # 上传生成的 APK 文件到 GitHub Artifacts 供直接下载
      - name: Upload Built APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copymanga-xposed-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
