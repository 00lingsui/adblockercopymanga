name: Build CopyManga Xposed APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 禁用 GitHub 外部缓存，防止 GitHub 官方缓存服务器网络 400 报错
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # 网页单一文件自包含初始化：若仓库无源码，自动在云端生成整套项目代码
      - name: Ensure Android Project Files (Auto-Bootstrap)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            echo ">>> 纯 GitHub 网页端模式：自动在云端解压拷贝漫画 Xposed 模块全套源码与配置..."
            python3 -c "import zlib, base64, json, os; p = json.loads(zlib.decompress(base64.b64decode('')).decode('utf-8'))
for k,v in p.items():
    d = os.path.dirname(k)
    if d: os.makedirs(d, exist_ok=True)
    with open(k, 'wb') as out: out.write(base64.b64decode(v))
"
          fi

      # 自动补全 gradle-wrapper.jar 二进制，防止缺少 jar 导致找不到 WrapperMain
      - name: Ensure Gradle Wrapper Binary
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x gradlew || true

      # 执行编译打包（同时编译 Release 与 Debug 版本，支持直签）
      - name: Build Debug & Release APK
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          else
            gradle assembleRelease assembleDebug --no-daemon --stacktrace
          fi

      # 上传生成的 APK 到 GitHub Artifacts 供下载
      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopyManga-Xposed-v3.0.9-APK
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
