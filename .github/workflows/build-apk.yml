name: Build CopyManga Xposed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 网页一键点击按钮重新打包

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Android Project Files (Auto-Bootstrap)
        run: |
          # 若仓库中尚未上传代码，云端自动写入拷贝漫画去广告模块全套源码与配置
          if [ ! -f "app/src/main/java/com/copymanga/xposed/MainHook.kt" ]; then
            echo ">>> 纯 GitHub 网页端模式：自动在云端初始化拷贝漫画 Xposed 模块源码..."
            mkdir -p app/src/main/java/com/copymanga/xposed/hooks
            mkdir -p app/src/main/java/com/copymanga/xposed/utils
            mkdir -p app/src/main/assets
            mkdir -p app/src/main/res/values

            cat << 'EOF' > settings.gradle.kts
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = java.net.URI("https://api.xposed.info/") }
    }
}
rootProject.name = "CopyMangaAdBlock"
include(":app")
