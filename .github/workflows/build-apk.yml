name: Build CopyManga Xposed APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 禁用 GitHub 缓存，彻底避免 GitHub 服务器 400 故障
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # 自动补全 gradle-wrapper.jar 二进制，防止缺少 jar 导致找不到 WrapperMain
      - name: Ensure Gradle Wrapper Binary
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x gradlew || true

      # 执行编译打包
      - name: Build Debug & Release APK
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          else
            gradle assembleRelease assembleDebug --no-daemon --stacktrace
          fi

      # 上传生成的 APK 到 GitHub Artifacts 供下载
      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopyManga-Xposed-v3.0.9-APK
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
